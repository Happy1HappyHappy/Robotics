# Settings for a run of the cone finder; cone_finder_launch.py loads this file. To change
# them without rebuilding, run the launch file with
#   params_file:=src/cs5335_cone_finder/config/cone_finder.yaml
# from the workspace root (robotics_ws). Every parameter not listed keeps its default
# (see the package README). Units are SI: m, s, rad, m/s, rad/s. Write decimals with a point
# (3.0, not 3): ROS refuses an integer where a float is declared.

cone_detector:
  ros__parameters:
    # YOLO-World, downloaded by ultralytics on first use; or the path of a .pt trained on cones
    model: yolov8s-worldv2.pt
    # text prompts for YOLO-World; for another model, its class names that are cones
    classes: ['traffic cone']
    confidence: 0.2           # 0-1, lower finds more cones and more false ones
    image_size: 320           # px the image is scaled to for YOLO
    device: ''                # '' = automatic, 'cpu', or '0' for the first GPU
    image_topic: oakd/rgb/preview/image_raw

    # Colors a cone may have, and each one's hue range [low, high] on OpenCV's scale
    # (0-179, degrees / 2); low > high wraps through 0 (red)
    colors: ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink']
    hue_ranges:
      red: [170, 4]
      orange: [5, 18]
      yellow: [20, 35]
      green: [40, 85]
      blue: [95, 130]
      purple: [131, 155]
      pink: [156, 169]
    min_saturation: 80        # 0-255, grayer pixels (floor, walls, white stripe) don't count
    min_value: 60             # 0-255, darker pixels don't count
    min_color_fraction: 0.15  # 0-1 of the pixels looked at must have the color
    color_region: 0.6         # 0-1 of the box (centered) whose pixels decide the color

cone_mission:
  ros__parameters:
    camera_info_topic: oakd/rgb/preview/camera_info  # must match the detector's image
    max_cones: 3

    # Gap (m) to leave between the robot and the base of a cone (about an inch)
    stop_gap: 0.025
    # The LiDAR sees a cone about 19 cm above the floor, where it is narrower than at its
    # base. Measure on your cone: half the base's width minus the cone's radius 19 cm up (m)
    cone_base_extra: 0.06

    scan_speed: 0.3           # rad/s, the turn while looking for cones
    max_linear_speed: 0.15    # m/s (TurtleBot 4 top speed 0.31)
    max_angular_speed: 0.8    # rad/s (TurtleBot 4 top speed 1.9)
    front_clearance: 0.2      # m, on the way back, stop if something is this close ahead
    start_delay: 3.0          # s to step away once all data is in
